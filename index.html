<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Úkoly</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: jednosloupcová appka – lepivá hlavička, obsah, dole rychlé přidání a lišta karet (jako PC appka Úkoly, tmavá jako výchozí) */
:root {
  --bg: #0e0e11; --side: #141418; --card: #1b1b20; --card2: #222228; --line: #2a2a31; --hover: #26262d;
  --text: #f1f1f4; --text2: #c9c9d0; --muted: #9a9aa3; --faint: #7c7c84;
  --accent: #6f86ff; --accent-soft: rgba(111,134,255,.16);
  --red: #ff5f5f; --orange: #f39a4a; --green: #3ccf91;
  --r-body: #ff3d71; --r-fokus: #a6e22e; --r-stul: #23b7f0;
  --track: rgba(255,255,255,.08);
  --shadow: 0 10px 30px rgba(0,0,0,.45); --toast-btn: #3c59e6;
  --f-ui: "Figtree", system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f4f4f1; --side: #ecece8; --card: #ffffff; --card2: #f6f6f3; --line: #e2e2dc; --hover: #efefea;
  --text: #17171a; --text2: #3a3a40; --muted: #6b6b70; --faint: #8e8e86;
  --accent: #3c59e6; --accent-soft: rgba(60,89,230,.12);
  --red: #d93636; --orange: #d9741c; --green: #179c62;
  --r-body: #e8245a; --r-fokus: #6aa80f; --r-stul: #0f94c9;
  --track: rgba(0,0,0,.08); --shadow: 0 10px 30px rgba(0,0,0,.12); --toast-btn: #9db0ff; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f4f4f1; --side: #ecece8; --card: #ffffff; --card2: #f6f6f3; --line: #e2e2dc; --hover: #efefea;
  --text: #17171a; --text2: #3a3a40; --muted: #6b6b70; --faint: #8e8e86;
  --accent: #3c59e6; --accent-soft: rgba(60,89,230,.12);
  --red: #d93636; --orange: #d9741c; --green: #179c62;
  --r-body: #e8245a; --r-fokus: #6aa80f; --r-stul: #0f94c9;
  --track: rgba(0,0,0,.08); --shadow: 0 10px 30px rgba(0,0,0,.12); --toast-btn: #9db0ff; color-scheme: light; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.4 var(--f-ui); -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* hlavička */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px; }
.toprow { display: flex; align-items: center; gap: 12px; }
.rings-mini { flex: none; width: 44px; height: 44px; border: 0; background: none; padding: 0; }
.ttl { flex: 1; min-width: 0; }
.ttl h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status .warn { color: var(--orange); }
.iconbtn { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; stroke: var(--text2); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text2); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.chip .n { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip.on .n { color: var(--bg); opacity: .7; }
.chip.alert .n { color: var(--red); }
.search { margin-top: 10px; display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 0 12px; }

main { padding-block: 4px 180px; overflow-x: clip; }
.kzkr { font-size: 12px; color: var(--muted); margin-top: 6px; font-style: italic; }
.sec { margin: 18px 2px 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.sec .r { letter-spacing: 0; text-transform: none; font-weight: 500; }

/* úkol */
.list { display: flex; flex-direction: column; gap: 8px; }
.task { position: relative; display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 12px 14px; overflow: hidden; transition: opacity .35s, transform .35s; }
.task::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--prio, transparent); }
.task.p1 { --prio: var(--red); } .task.p2 { --prio: var(--orange); }
.task.gone { opacity: 0; transform: translateX(24px); }
.check { flex: none; width: 26px; height: 26px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--faint); background: none; display: grid; place-items: center; padding: 0; }
.check svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; }
.task.done .check { background: var(--green); border-color: var(--green); }
.task.done .check svg { opacity: 1; }
.task.done .tn { text-decoration: line-through; color: var(--muted); }
.tb { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; }
.tn { font-weight: 650; font-size: 15.5px; overflow-wrap: anywhere; }
.meta { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); }
.meta .late { color: var(--red); font-weight: 600; }
.meta .soon { color: var(--orange); font-weight: 600; }
.meta .zak { color: var(--text2); background: var(--card2); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pin { color: var(--accent); }
.pending { font-size: 11px; color: var(--orange); font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 48px 12px; }
.empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }

/* návrhy */
.nav { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.nav .od { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.nav .pz { font-size: 13.5px; color: var(--text2); white-space: pre-wrap; overflow-wrap: anywhere; }
.nav .det { font-size: 13.5px; color: var(--text2); white-space: pre-wrap; overflow-wrap: anywhere; border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.nav .det .dm { font-size: 12.5px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--card2); border-radius: 10px; padding: 9px 14px; font-weight: 650; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--red); }
.btn.wide { flex: 1; }

/* spodní lišty */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.add { display: flex; gap: 8px; padding-block: 10px 4px; }
.add input { flex: 1; min-width: 0; height: 46px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); padding: 0 14px; font-size: 16px; }
.add input:focus { border-color: var(--accent); outline: none; }
.add button { width: 46px; height: 46px; border-radius: 14px; border: 0; background: var(--accent); color: #fff; font-size: 24px; line-height: 1; }
.add button.mic { background: var(--card); border: 1.5px solid var(--line); color: var(--text); display: flex; align-items: center; justify-content: center; }
.add button.mic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.add button.mic.on { background: var(--accent); border-color: transparent; color: #fff; }
/* poslech – namluvení úkolu */
.mic-ui { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end; }
.mic-ui[hidden] { display: none; }
.mic-ui .mscrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); animation: fadeIn .25s ease-out; }
.mic-ui .mpanel { position: relative; background: var(--side); border-radius: 24px 24px 0 0; box-shadow: var(--shadow); padding: 26px 20px calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 14px; animation: sheetIn .34s cubic-bezier(.2, .9, .25, 1); }
.mic-ui.out .mpanel { animation: sheetOut .22s ease-in forwards; } .mic-ui.out .mscrim { animation: fadeOut .22s ease-in forwards; }
.morb { position: relative; width: 132px; height: 132px; display: grid; place-items: center; margin: 4px 0 2px; }
.morb .jadro { position: relative; z-index: 2; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 70%, #fff), var(--accent) 60%, color-mix(in srgb, var(--accent) 70%, #000));
  box-shadow: 0 0 0 6px var(--accent-soft), 0 10px 28px color-mix(in srgb, var(--accent) 45%, transparent); transition: transform .18s ease; }
.morb .jadro svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.morb .vlna { position: absolute; inset: 28px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; animation: vlna 2.4s cubic-bezier(.2, .6, .3, 1) infinite; }
.morb .vlna:nth-child(2) { animation-delay: .8s; } .morb .vlna:nth-child(3) { animation-delay: 1.6s; }
.mic-ui.zvuk .morb .vlna { animation-duration: 1.3s; border-width: 3px; }
.mic-ui.zvuk .morb .jadro { animation: dech .9s ease-in-out infinite; }
.mic-ui.hotovo .morb .vlna { animation: none; opacity: 0; }
.mic-ui.hotovo .morb .jadro { background: var(--green); box-shadow: 0 0 0 6px color-mix(in srgb, var(--green) 18%, transparent); animation: none; transform: scale(1.04); }
.mic-ui.chyba .morb .vlna { animation: none; opacity: 0; } .mic-ui.chyba .morb .jadro { background: var(--card2); color: var(--muted); box-shadow: none; animation: none; }
@keyframes vlna { 0% { transform: scale(.85); opacity: .55; } 100% { transform: scale(2.1); opacity: 0; } }
@keyframes dech { 50% { transform: scale(1.08); } }
.morb .ik-ok { display: none; stroke-width: 2.6; } .mic-ui.hotovo .ik-mic { display: none; } .mic-ui.hotovo .ik-ok { display: block; animation: draw .45s ease-out both; stroke-dasharray: 26; }
.mic-ui.hotovo .row { visibility: hidden; }
.mstav { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.mic-ui.hotovo .mstav { color: var(--green); } .mic-ui.chyba .mstav { color: var(--muted); }
.mtext { width: 100%; min-height: 58px; max-height: 32vh; overflow-y: auto; text-align: center; font-size: 21px; line-height: 1.35; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
.mtext .int { color: var(--muted); font-weight: 500; }
.mtext .ph { color: var(--faint); font-weight: 500; font-size: 17px; }
.mhint { font-size: 12.5px; color: var(--muted); text-align: center; max-width: 320px; }
.mic-ui .row { width: 100%; margin-top: 4px; }
.task .diktat { color: var(--accent); font-weight: 700; }
.hint { font-size: 11.5px; color: var(--faint); padding-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { border: 0; background: none; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); position: relative; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--text); }
.tab .badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 5px; }

/* kalendář */
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.mhead { display: flex; align-items: center; justify-content: space-between; margin: 10px 2px; }
.mhead b { font-size: 17px; }
.mhead .row button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
.dw { text-align: center; font-size: 11px; color: var(--muted); font-weight: 700; padding-bottom: 4px; }
.day { aspect-ratio: 1 / 1; max-width: 100%; min-width: 0; padding: 0; border: 0; border-radius: 10px; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-variant-numeric: tabular-nums; font-weight: 600; }
.day.out { color: var(--faint); font-weight: 400; }
.day.vik { color: var(--muted); }
.day.today span:first-child { background: var(--accent); color: #fff; border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; }
.day.sel { background: var(--accent-soft); }
.dots { display: flex; gap: 2px; height: 5px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
.dots i.r { background: var(--red); }

/* přehled */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.hero svg.rings { width: 132px; height: 132px; flex: none; }
.legend { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
.legend div { display: grid; grid-template-columns: 10px 1fr; gap: 2px 8px; align-items: baseline; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend b { font-size: 16px; font-variant-numeric: tabular-nums; }
.legend small { grid-column: 2; color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.tile { min-width: 0; overflow-wrap: anywhere; }
.tile .k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.tile .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile .s { font-size: 12px; color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; margin: 8px 0 4px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-top: 10px; }
.medal { text-align: center; padding: 10px 4px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); }
.medal .g { width: 40px; height: 40px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: #fff; background: var(--track); }
.medal.t0 .g { color: var(--faint); }
.medal.t1 .g { background: linear-gradient(140deg, #c98b4f, #8a5a2b); }
.medal.t2 .g { background: linear-gradient(140deg, #d9dde3, #8d949e); }
.medal.t3 .g { background: linear-gradient(140deg, #ffd66b, #c99317); }
.medal small { font-size: 11.5px; color: var(--text2); display: block; line-height: 1.2; }
.chart { width: 100%; height: auto; display: block; margin-top: 8px; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--f-ui); }

/* list (sheet) */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--side); border-radius: 20px 20px 0 0; box-shadow: var(--shadow); max-height: 92%; overflow-y: auto; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet .wrap { padding-block: 10px 0; display: flex; flex-direction: column; gap: 12px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px; }
.fld { display: flex; flex-direction: column; gap: 5px; }
.fld > label, .fld > span { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.fld input, .fld textarea, .fld select { width: 100%; min-width: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 10px 12px; }
.fld textarea { min-height: 84px; resize: vertical; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--card); padding: 9px 4px; font-weight: 600; color: var(--text2); }
.seg button.on { background: var(--text); color: var(--bg); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; color: var(--text2); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 2px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
.confirm { background: color-mix(in srgb, var(--red) 12%, var(--card)); border: 1px solid var(--red); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

/* toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--text); color: var(--bg); border-radius: 12px; padding: 10px 14px; font-weight: 600; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.toast button { border: 0; background: none; color: var(--toast-btn); font-weight: 800; padding: 0; }
.banner { margin-top: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--text2); }
/* animace: listy, úkoly, oslava */
@keyframes fadeIn { from { opacity: 0; } }
@keyframes sheetIn { from { transform: translateY(100%); } }
@keyframes sheetOut { to { transform: translateY(100%); } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes taskIn { from { opacity: 0; transform: translateY(10px); } }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes ring { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 55%, transparent); } to { box-shadow: 0 0 0 12px transparent; } }
@keyframes flash { 0% { box-shadow: 0 0 0 0 transparent; border-color: var(--line); } 15% { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; border-color: var(--line); } }
@keyframes kfly { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), calc(var(--dy) + 160px)) rotate(var(--r)); opacity: 0; } }
@keyframes breath { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent); } 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent); } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--orange) 35%, transparent); } }
@keyframes draw { from { stroke-dashoffset: 26; } }
@keyframes slide { from { left: -30%; } to { left: 100%; } }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } }
@keyframes strike { from { background-size: 0 1px; } }
.scrim { animation: fadeIn .25s ease-out; }
.sheet { animation: sheetIn .34s cubic-bezier(.2, .9, .25, 1); transition: transform .25s cubic-bezier(.2, .9, .25, 1); }
.sheet.out { animation: sheetOut .22s ease-in forwards; }
.scrim.out { animation: fadeOut .22s ease-in forwards; }
.toast { animation: toastIn .25s cubic-bezier(.2, .9, .25, 1); }

function tile(k, v, s) { return '<div class="card tile"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div><div class="s">' + esc(s) + "</div></div>"; }
function graf(dny) {

  dny.forEach(function (d) { max = Math.max(max, d.hotovo, d.pribylo); });
  var cw = (W - padL) / dny.length, bw = Math.max(3, cw / 2 - 2), out = "";
  var tick = max <= 4 ? 1 : Math.ceil(max / 4);
  for (var t = 0; t <= max; t += tick) { var y = H - padB - (H - padB - 8) * t / max; out += '<line x1="' + padL + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)"/><text x="0" y="' + (y + 3) + '">' + t + "</text>"; }
  dny.forEach(function (d, i) {
    var x = padL + i * cw + 1, hh = (H - padB - 8) * d.hotovo / max, hp = (H - padB - 8) * d.pribylo / max;
    if (d.hotovo) out += '<rect x="' + x + '" y="' + (H - padB - hh) + '" width="' + bw + '" height="' + hh + '" rx="2" fill="var(--accent)"/>';
    if (d.pribylo) out += '<rect x="' + (x + bw + 1) + '" y="' + (H - padB - hp) + '" width="' + bw + '" height="' + hp + '" rx="2" fill="var(--orange)"/>';
    if (i % 2 === 1 || i === dny.length - 1) { var dd = parseD(d.den); out += '<text x="' + (x + bw) + '" y="' + (H - 4) + '" text-anchor="middle">' + dd.getDate() + ".</text>"; }
  });
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Hotové a nové úkoly po dnech">' + out + "</svg>";
}

(function () {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, btn = $("micBtn");
  if (!SR) return;

  var ui = $("micUI"), stav = $("micStav"), txt = $("micText"), hint = $("micHint"), bHot = $("micHotovo"), bZr = $("micZrusit");
  var rec = null, fin = "", int = "", zruseno = false, konec = false, hotovo = false;
  var HINT = hint.textContent;
  function kresli() {
    txt.innerHTML = fin || int ? esc(fin) + (int ? '<span class="int">' + (fin ? " " : "") + esc(int) + "</span>" : "")
                               : '<span class="ph">Řekni, co je potřeba udělat…</span>';
    txt.scrollTop = txt.scrollHeight;
  }
  function zavri(hned) {

  }

    bHot.textContent = "Zkusit znovu"; bHot.dataset.znovu = "1";
  }

      setTimeout(function () { zavri(); toast("Namluveno – Claude to upraví a zařadí", function () { vratit(opId, ["smazat", nid]); }); }, 650);
    }, function () { zavri(); $("addInput").value = t; });
  }
  function start() {
    fin = ""; int = ""; zruseno = false; konec = false; hotovo = false;
    ui.className = "mic-ui"; ui.hidden = false;
    stav.textContent = "Poslouchám"; hint.textContent = HINT; bHot.textContent = "Hotovo"; delete bHot.dataset.znovu;
